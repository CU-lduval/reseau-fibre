<style>

.mh{display:flex;gap:8px;align-items:center;margin-bottom:8px}

.u.p{background:#cbd5e1}.u.e{background:#a7f3d0}
.u.on{outline:3px solid var(--ac)}

#rack .r input{min-width:120px}
.kc{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:4px}.kc select{width:100%;min-width:0}.kc select:first-child{grid-column:1/-1}
.cw{display:flex;align-items:center;gap:4px}.cw select{flex:1 1 auto;width:auto;min-width:84px}
#tb td:nth-child(2){width:42%;min-width:220px}#tb td:nth-child(3){width:1%;min-width:195px}#tb td:nth-child(5){width:20%;min-width:130px}#tb td:nth-child(4){min-width:156px}.ci{flex:none;display:inline-flex;justify-content:center;width:56px}
#pr{display:none}
#cb,#pbar{display:none;position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:3;gap:6px;background:var(--pn);padding:6px;border:1px solid var(--bd);border-radius:8px}
@page{size:A4;margin:12mm}
@media print{body>*:not(#pr){display:none!important}html{height:auto}body{display:block;height:auto;background:#fff}#pr{display:block!important}}
#ts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:20}
#sdt{display:none}
body{overscroll-behavior:none}
@media (max-width:760px),(pointer:coarse) and (max-width:1400px){main{flex-direction:column-reverse}#ddf+.sp+.sp{display:none}aside{display:none;width:auto;max-height:42%;border-right:0;border-top:1px solid var(--bd)}body.sdo aside{display:block}.bd{grid-template-columns:1fr}
 #sdt{display:inline-block}#ti{display:none}
 header{flex-wrap:nowrap;overflow-x:auto;gap:4px;padding:6px 8px}header button,header .fb{flex:none;white-space:nowrap}header .sp{flex:none}
 #ov{padding:env(safe-area-inset-top,0px) 0 0}#md{width:100%;max-height:100%;border-radius:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px))}
 #tb table{min-width:720px}#hn{font-size:11px;bottom:6px}}
@media (pointer:coarse) and (min-width:900px){.bd{grid-template-columns:350px minmax(0,1fr)}#md{max-width:1000px;margin:auto;border-radius:12px;max-height:94%}#ov{padding:2% 0}body>#tools{padding-inline:max(6px,(100% - 900px)/2)}aside{max-height:38%}}
@media (pointer:coarse){button,.fb{min-height:40px;padding:8px 12px}input,select,textarea{font-size:16px;min-height:36px}input[type=color]{width:40px;height:36px}.pp i{width:7px;height:7px}}
</style></head>
<body>
<header>
 <div class="dd" id="ddf"><button onclick="dd(event,'f')">📁 Fichier ▾</button>
  <div class="dm" id="dm-f" onclick="hideDd()">
   <button onclick="newPlan()">🆕 Nouveau plan</button>

   <button id="inst" style="display:none" onclick="installApp()">📲 Installer l’application</button>
  </div></div>
 <span class="sp"></span>
 <div id="tools">
  <button id="m-sel" class="tb on" onclick="setMode('sel')" title="Sélection (V)"><i>☝</i><span>Sélection</span></button>
  <button id="m-node" class="tb" onclick="setMode('node')" title="Poser des nœuds (N)"><i>●</i><span>Nœud</span></button>

 </div>
 <span class="sp"></span>
 <button onclick="undo()" title="Annuler (Ctrl+Z)">↶</button>
 <button onclick="fit();draw()" title="Ajuster la vue au plan">⤢</button>
 <div class="dd"><button onclick="dd(event,'b')">🗺 Fond de plan ▾</button>
  <div class="dm" id="dm-b" onclick="hideDd()">
   <label>🖼 Importer une image ou un PDF…<input type="file" accept="image/*,.pdf,application/pdf" onchange="setBg(this)"></label>
   <button onclick="openBgEdit()">✂ Rotation, recadrage, opacité…</button>
   <button onclick="rmBg()">🗑 Retirer le fond</button>
  </div></div>
 <span class="sp"></span>
 <div class="nm"><input id="pnm" title="Nom du plan" onchange="S.name=this.value.trim()||'Plan';touch()"><button id="svb" onclick="quickSave()" title="Enregistrer (Ctrl+S)">💾 Enregistrer</button><span id="ti"></span></div>
 <button id="sdt" onclick="sdMan=!sdMan;side()">☰ Panneau</button>
</header>
<main>
 <aside id="sd"></aside>
 <div id="st"><div id="hn"></div><div id="pbar"><button onclick="pp.pop();draw()">↶ Point</button><button class="d" onclick="cancelPath()">✕ Annuler</button></div><div id="cb"><button class="p" onclick="doCrop()">✓ Recadrer</button><button onclick="setMode('sel')">✕ Annuler</button></div><svg id="sv">
  <defs><pattern id="gr" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#8886" stroke-width="1"/></pattern></defs>
  <g id="vp"><rect id="bgr" fill="url(#gr)" stroke="#8888"/><image id="bgi"/><g id="ly"></g></g>
 </svg></div>
</main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const FT=['OS2','OM3','OM4','OM5','OM1/OM2'],CN=['SC','LC','ST'];
const icOld=c=>{const b='stroke="#475569" stroke-width="1"',f='<rect x="1" y="8.2" width="8" height="3.6" fill="#e2e8f0" '+b+'/>',bt=x=>`<rect x="${x}" y="7" width="${33-x}" height="6" rx="2" fill="#94a3b8"/>`;
 const s=c=='SC'?`${f}<rect x="9" y="3" width="15" height="14" rx="1.5" fill="#60a5fa" ${b}/><path d="M12 6v8M15 6v8" stroke="#1e40af" stroke-width="1"/>${bt(24)}`
 :c=='ST'?`${f}<rect x="9" y="4" width="10" height="12" rx="3" fill="#a3a3a3" ${b}/><path d="M12 4v5h4" fill="none" stroke="#404040" stroke-width="1.2"/><path d="M11 12.5h6" stroke="#404040" stroke-width="1"/><rect x="19" y="6" width="6" height="8" rx="1" fill="#737373"/>${bt(25)}`
 :`${f}<rect x="9" y="5.5" width="13" height="9" rx="1.5" fill="#34d399" ${b}/><path d="M12 5.5l2-3h6l1.5 3z" fill="#10b981" ${b}/>${bt(22)}`;
 return`<svg viewBox="0 0 34 20" width="34" height="20" aria-label="${c}">${s}</svg>`};
const sel=(a,v,at)=>`<select ${at||''}>${a.map(o=>`<option${o==v?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
const blank=()=>({name:'Nouveau plan',bg:null,w:1200,h:800,mpp:0,showLen:false,bgOp:1,nodes:[],links:[],types:[{n:'Backbone',c:'#e11d48'},{n:'Distribution',c:'#2563eb'},{n:'Raccordement',c:'#16a34a'}]});
let S=blank(),mode='sel',linkType=0,from=null,selLink=null,view={x:0,y:0,k:1},bn=null,su=null,pt,cur=null,pp=[];
const lpts=l=>{const a=nd(l.a),b=nd(l.b);return a&&b?[a,...(l.pts||[]),b]:null};
const nd=id=>S.nodes.find(n=>n.id==id),nm=id=>(nd(id)||{}).n||'?';
const cu=()=>bn&&bn.units.find(u=>u.id==su);
const idb=(m,k,v)=>new Promise((ok,ko)=>{try{const r=indexedDB.open('fibre',1);r.onupgradeneeded=()=>r.result.createObjectStore('b');r.onerror=()=>ko(r.error);
 r.onsuccess=()=>{const s=r.result.transaction('b',m=='get'?'readonly':'readwrite').objectStore('b'),q=m=='get'?s.get(k):m=='set'?s.put(v,k):s.delete(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ko(q.error)}}catch(e){ko(e)}});
let lastBgSaved=null;
let dirty=false;
const statUpd=()=>{const e=$('#ti');if(e)e.textContent=dirty?'● Modifié':'Enregistré ✓';const i=$('#pnm');if(i&&document.activeElement!==i)i.value=S.name};
const persist=nd0=>{if(!nd0){dirty=true;statUpd()}clearTimeout(pt);pt=setTimeout(async()=>{try{localStorage.setItem('fibre:draft',JSON.stringify(S,(k,v)=>k=='bg'?undefined:v));if(S.bg!==lastBgSaved){const b=S.bg;await idb('set','draft',b||null);lastBgSaved=b}}catch(e){}},400)};
const U=[];let lastSnap=null;
const snap=()=>JSON.stringify(S,(k,v)=>k=='bg'||k=='w'||k=='h'?undefined:v);
const touch=()=>{const s=snap();let ch=false;if(lastSnap&&s!=lastSnap){ch=true;U.push(lastSnap);if(U.length>60)U.shift()}lastSnap=s;draw();side();persist(!ch)};
function undo(){if(!U.length){toast('Rien à annuler');return}const o=JSON.parse(U.pop());S=Object.assign(blank(),o,{bg:S.bg,w:S.w,h:S.h});lastSnap=snap();if(!nd(from))from=null;if(!curL())selLink=null;draw();side();persist();toast('Annulé')}
function toast(t,ms){const e=$('#ts');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms||2600)}

/* ---------- Plan ---------- */
function fit(){const r=$('#sv').getBoundingClientRect(),k=Math.min(r.width/S.w,r.height/S.h)*.96||1;view={k,x:(r.width-S.w*k)/2,y:(r.height-S.h*k)/2}}
function draw(){
 $('#vp').setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.k})`);
 const r=$('#bgr');r.setAttribute('width',S.w);r.setAttribute('height',S.h);r.style.display=S.bg?'none':'';
 const bi=$('#bgi');bi.setAttribute('width',S.w);bi.setAttribute('height',S.h);bi.setAttribute('opacity',S.bgOp==null?1:S.bgOp);
 if(S.bg){if(bi.getAttribute('href')!==S.bg)bi.setAttribute('href',S.bg);bi.style.display=''}else bi.style.display='none';
 const s=Math.min(8,Math.max(.7,1/view.k));let h='';
 S.links.forEach(l=>{const q=lpts(l);if(!q)return;const t=S.types[l.t]||S.types[0]||{c:'#888'},ps=q.map(p=>p.x+','+p.y).join(' ');
  h+=`<polyline points="${ps}" fill="none" stroke="${t.c}" stroke-width="${(l.id==selLink?8:4)*s}" stroke-linecap="round" stroke-linejoin="round"/>`;
  h+=`<polyline data-l="${l.id}" points="${ps}" fill="none" stroke="transparent" stroke-width="${(T?30:16)*s}" style="cursor:pointer"/>`;
  const lt=[l.lb,S.showLen&&S.mpp?fm(llen(l)):''].filter(Boolean).join(' · ');if(lt){const i=Math.floor((q.length-1)/2),x=(q[i].x+q[i+1].x)/2,y=(q[i].y+q[i+1].y)/2;h+=`<text class="lb" transform="translate(${x} ${y-6*s}) scale(${s})">${esc(lt)}</text>`}
  if(l.id==selLink)(l.pts||[]).forEach((p,i)=>h+=`<circle data-h="${l.id}:${i}" cx="${p.x}" cy="${p.y}" r="${(T?12:7)*s}" fill="#fff" stroke="${t.c}" stroke-width="${3*s}" style="cursor:move"/>`)});
 if(mode=='path'&&from&&cur){const a=nd(from),t=S.types[linkType]||{c:'#888'};h+=`<polyline points="${[a,...pp,cur].map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="${t.c}" stroke-width="${4*s}" stroke-dasharray="${10*s} ${6*s}" stroke-linecap="round" stroke-linejoin="round"/>`;pp.forEach(p=>h+=`<circle cx="${p.x}" cy="${p.y}" r="${5*s}" fill="${t.c}"/>`)}
 S.nodes.forEach(n=>{h+=`<g data-n="${n.id}" transform="translate(${n.x} ${n.y}) scale(${s})" style="cursor:pointer"><circle r="${T?19:13}" fill="${from==n.id||hl==n.id?'#fde047':'#fff'}" stroke="#1d2433" stroke-width="3"/><circle r="4" fill="#1d2433"/><text class="nl" y="30">${esc(n.n)}</text></g>`});
 if(mode=='scale'&&sp.length){const q=sp.length<2&&cur?[sp[0],cur]:sp;h+=`<polyline points="${q.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#f59e0b" stroke-width="${3*s}" stroke-dasharray="${8*s} ${5*s}"/>`+sp.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="${6*s}" fill="#f59e0b" stroke="#fff" stroke-width="${2*s}"/>`).join('')}
 if(mode=='crop'&&cr){const X=Math.min(cr.x0,cr.x1),Y=Math.min(cr.y0,cr.y1),Wd=Math.abs(cr.x1-cr.x0),Hd=Math.abs(cr.y1-cr.y0);h+=`<path d="M0 0H${S.w}V${S.h}H0Z M${X} ${Y}h${Wd}v${Hd}h${-Wd}Z" fill="rgba(0,0,0,.45)" fill-rule="evenodd"/><rect x="${X}" y="${Y}" width="${Wd}" height="${Hd}" fill="none" stroke="#f59e0b" stroke-width="${2*s}" stroke-dasharray="${8*s} ${5*s}"/>`}
 $('#ly').innerHTML=h;statUpd();$('#pbar').style.display=mode=='path'&&from?'flex':'none';
 $('#hn').textContent=hz(mode=='crop'?'Recadrage : tracez le rectangle à conserver, puis validez (vous pouvez le retracer).':mode=='scale'?'Échelle : cliquez sur deux points dont vous connaissez la distance réelle (Échap annule).':mode=='sel'?'Sélection : glissez un nœud, cliquez dessus pour ouvrir sa baie, cliquez sur une liaison pour modifier son tracé.':mode=='node'?'Nœud : cliquez sur le plan pour poser un nœud.':mode=='link'?(from?'Cliquez sur le nœud d’arrivée.':'Liaison droite : cliquez sur le nœud de départ.'):from?'Cliquez pour poser les points du trajet, puis sur le nœud d’arrivée (Échap annule, Retour arrière retire le dernier point).':selLink?'Cliquez-glissez sur la liaison pour ajouter un point, double-clic sur un point pour le retirer. Suppr supprime la liaison.':'Tracé libre : cliquez sur un nœud de départ, ou sur une liaison pour modifier son tracé.');
}
function setMode(m){mode=m;autoPath=0;sp=[];cr=null;$('#cb').style.display='none';from=null;pp=[];cur=null;['sel','node','link','path','scale'].forEach(x=>$('#m-'+x).classList.toggle('on',x==m));$('#sv').style.cursor=m=='sel'?'grab':'crosshair';draw()}
const sv=$('#sv');
const P=e=>{const r=sv.getBoundingClientRect();return[(e.clientX-r.left-view.x)/view.k,(e.clientY-r.top-view.y)/view.k]};
function onDown(e){
 if(e.button==2)return;

const ic=c=>{
 const im=CI[c]||PH[c];if(im)return`<img alt="${c}" src="${im}" style="width:56px;height:40px;object-fit:contain">`;
 const d=`<defs><linearGradient id="gw${c}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#e5e7eb"/><stop offset="1" stop-color="#9ca3af"/></linearGradient><linearGradient id="gb${c}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c=='ST'?'#e5e7eb':c=='SC'?'#93c5fd':'#7dd3fc'}"/><stop offset=".5" stop-color="${c=='ST'?'#9ca3af':c=='SC'?'#3b82f6':'#0ea5e9'}"/><stop offset="1" stop-color="${c=='ST'?'#4b5563':c=='SC'?'#1e3a8a':'#075985'}"/></linearGradient><linearGradient id="gk${c}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b7280"/><stop offset="1" stop-color="#111827"/></linearGradient></defs>`;
 const cab='<rect x="49" y="14" width="15" height="4" rx="2" fill="#facc15"/><rect x="49" y="14" width="15" height="1.4" rx=".7" fill="#fde68a"/>';
 const fe=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h/2.2}" fill="url(#gw${c})" stroke="#6b7280" stroke-width=".6"/><rect x="${x+1.5}" y="${y+1}" width="${w-4}" height="1.2" rx=".6" fill="#fff" opacity=".9"/>`;
 const bo=(x,w)=>`<rect x="${x}" y="11" width="${w}" height="10" rx="2.5" fill="url(#gk${c})"/><path d="M${x+3} 12v8M${x+6} 12v8" stroke="#6b7280" stroke-width=".6"/>`;
 const hl=(x,y,w)=>`<rect x="${x}" y="${y}" width="${w}" height="1.4" rx=".7" fill="#fff" opacity=".55"/>`;
 let s;
 if(c=='SC')s=fe(1,12,13,8)+`<rect x="14" y="4" width="22" height="24" rx="2.5" fill="url(#gb${c})" stroke="#1e3a8a" stroke-width=".7"/>${hl(16,6,18)}<path d="M18 10v12M22 10v12M26 10v12M30 10v12" stroke="#1e3a8a" stroke-width=".5" opacity=".55"/>`+bo(36,13)+cab;
 else if(c=='ST')s=fe(1,12.5,13,7)+`<rect x="14" y="6" width="17" height="20" rx="5" fill="url(#gb${c})" stroke="#374151" stroke-width=".7"/>${hl(17,8,11)}<path d="M18 6v7h6" fill="none" stroke="#1f2937" stroke-width="1.3" stroke-linejoin="round"/><path d="M20 17v6M23 17v6M26 17v6M29 17v6" stroke="#374151" stroke-width=".7"/>`+bo(31,18)+cab;
 else s=fe(1,12,15,8)+`<path d="M20 9l3.5-6h14L38 9z" fill="url(#gb${c})" stroke="#075985" stroke-width=".7" stroke-linejoin="round"/><rect x="16" y="9" width="23" height="14" rx="2.5" fill="url(#gb${c})" stroke="#075985" stroke-width=".7"/>${hl(18,11,18)}<path d="M25 4.5h9" stroke="#075985" stroke-width=".6" opacity=".6"/>`+bo(39,10)+cab;

 let h=`<h3>${esc(u.n)} · ${u.p} paires</h3><div style="font-weight:700;font-size:15px;margin:0 0 6px">${esc(rt(nn,bn,u))}</div><div class="r"><button onclick="openConn()">🖼 Illustrations des connecteurs…</button></div><datalist id="dl">${S.nodes.map(n=>`<option value="${esc(n.n)}">`+ensB(n).filter(b=>b!==bn).map(b=>`<option value="${esc(n.n+' › '+b.n)}">`+b.units.filter(x=>x.t=='p'&&(!x.lk||x.lk.u==u.id)).map(x=>`<option value="${esc(n.n+' › '+b.n+' › '+x.n)}">`).join('')).join('')).join('')}</datalist><table><tr><th>N°</th><th>Rôle / service</th><th>Raccordé à</th><th>Conn.</th><th>Remarque</th></tr>`;
 for(let i=0;i<u.p;i++){const r=u.rows[i]||{},a=`data-i="${i}" data-k=`;
  h+=`<tr><td>${i+1}</td><td><input ${a}"r" value="${esc(r.r)}"></td><td>${kcell(u,i,r)}</td><td><div class="cw"><span class="ci">${ic(r.c||'SC')}</span>${sel(CN,r.c||'SC',a+'"c"')}</div></td><td><input ${a}"m" value="${esc(r.m)}"></td></tr>`}
 el.innerHTML=h+'</table>'}
$('#md').addEventListener('input',e=>{const t=e.target,u=cu();if(!u||u.t!='p'||!t.dataset.k)return;const i=+t.dataset.i,k=t.dataset.k;
 if(k=='k'||k=='tu'||k=='ti'){pairAct(u,i,k,t.value);return}
 (u.rows[i]=u.rows[i]||{})[k]=t.value;
 if(k=='c'){const ci=t.parentNode.querySelector('.ci');if(ci)ci.innerHTML=ic(t.value)}
 if(k=='r')propRole(u,i,t.value);
 rack();persist()});
function addU(t){const k=bn.units.filter(u=>u.t==t).length+1,u={id:uid(),t,n:(t=='p'?'Bandeau ':'Équipement ')+k,u:1,p:t=='p'?+$('#np').value:0,rows:[],note:''};bn.units.push(u);su=u.id;rack();tbl();persist()}
function pick(id){su=id;rack();tbl()}
function selBaie(id){bn=nn.baies.find(b=>b.id==id);su=null;delBaie.c=0;rack();tbl()}
function addBaie(){const b={id:uid(),n:'Baie '+(nn.baies.length+1),units:[]};nn.baies.push(b);bn=b;su=null;delBaie.c=0;rack();tbl();persist()}
function delBaie(e){if(nn.baies.length<2){toast('Un nœud garde au moins une baie');return}
 if(!delBaie.c){delBaie.c=1;e.target.textContent='Cliquer à nouveau pour confirmer';return}
 delBaie.c=0;bn.units.forEach(unlink);nn.baies=nn.baies.filter(b=>b!=bn);bn=nn.baies[0];su=null;rack();tbl();persist()}
function mv(d){const a=bn.units,i=a.findIndex(u=>u.id==su),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];rack();persist()}
function delU(){const du=cu();(du.rows||[]).forEach((r,i)=>{if(r&&r.t)unlinkPair(du,i)});unlink(du);bn.units=bn.units.filter(u=>u.id!=su);su=null;rack();tbl();persist()}
function delNode(e){if(!delNode.c){delNode.c=1;e.target.textContent='Cliquer à nouveau pour confirmer';return}
 ensB(nn).forEach(b=>b.units.forEach(unlink));const id=nn.id;S.nodes=S.nodes.filter(n=>n.id!=id);S.links=S.links.filter(l=>l.a!=id&&l.b!=id);closeM();touch()}

/* ---------- Enregistrer / charger ---------- */
function openFile(){
 modal(`<div class="mh"><b class="ttl">Ouvrir un plan</b><button onclick="closeM()">✕</button></div><h3>Plans enregistrés dans ce navigateur</h3><div id="pl"></div><h3>Depuis un fichier</h3><div class="r"><label class="fb">📥 Choisir un fichier (.json)…<input type="file" accept=".json,.txt,application/json,text/plain" onchange="impF(this)"></label></div><h3>Coller un texte</h3><p class="hint">Texte exporté depuis un autre appareil (il commence par FIBRE1: ou par {).</p><textarea id="pst" rows="4" style="width:100%"></textarea><div class="r"><button onclick="impo($('#pst').value)">Importer le texte</button></div>`);plist()}
function plist(){let h='';try{Object.keys(localStorage).filter(k=>k.startsWith('fibre:p:')).sort().forEach(k=>h+=`<div class="r"><span style="flex:1">${esc(k.slice(8))}</span><button data-a="l" data-k="${esc(k)}">Charger</button><button class="d" data-a="d" data-k="${esc(k)}">Supprimer</button></div>`)}catch(e){}
 $('#pl').innerHTML=h||'<p class="hint">Aucun plan enregistré.</p>'}
let ovd=false;$('#ov').addEventListener('pointerdown',e=>{ovd=e.target.id=='ov'});
$('#ov').addEventListener('click',e=>{
 if(e.target.id=='ov'){if(ovd)closeM();return}
 const b=e.target.closest('[data-a]');if(!b)return;const k=b.dataset.k;
 if(b.dataset.a=='d'){localStorage.removeItem(k);idb('del','p:'+k.slice(8)).catch(()=>{});plist()}
 else(async()=>{try{const o=JSON.parse(localStorage.getItem(k));if(!o.bg){try{o.bg=await idb('get','p:'+k.slice(8))||null}catch(x){}}load(o)}catch(x){toast('Plan illisible')}})()});
function load(o){S=Object.assign(blank(),o);selLink=null;from=null;U.length=0;lastSnap=null;dirty=false;fit();touch();closeM()}
async function dlP(){const n=(S.name||'plan').replace(/[^a-zA-Z0-9À-ÿ _-]+/g,'_').trim()||'plan',data=JSON.stringify(S),r=await saveFile(n+'.json',data,'application/json');
 if(r=='ok')toast('Fichier enregistré');else if(r=='none'){if(!$('#exj'))openExportPlan();toast('Téléchargement indisponible ici : copiez ou partagez le texte',6000)}}
async function impo(s){try{s=(s||'').trim();if(s.startsWith('FIBRE1:'))s=await gunzip(s.slice(7));load(JSON.parse(s));dirty=true;statUpd();if(!S.bg&&S.nodes.length)toast('Plan importé sans fond de plan : ajoutez-le avec Fond de plan › Importer',7000)}catch(e){toast('Texte invalide ou incomplet : collez le texte exporté en entier')}}
function impF(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>impo(r.result);r.readAsText(f)}
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&(e.key||'').toLowerCase()=='s'){e.preventDefault();quickSave();return}
 if(e.key=='Escape'){closeM();hideCm();hideDd();if(sp.length){sp=[];draw()}if(from){from=null;pp=[];cur=null;draw()}else if(selLink){selLink=null;if(autoPath)setMode('sel');side();draw()}}
 if(e.key=='Backspace'&&mode=='path'&&pp.length&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();pp.pop();draw()}
 const free=!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&$('#ov').style.display!='flex';
 if(free&&e.key=='Delete'&&selLink){S.links=S.links.filter(l=>l.id!=selLink);selLink=null;if(autoPath)setMode('sel');touch()}
 if(free&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='z'){e.preventDefault();undo()}
 if(free&&!e.ctrlKey&&!e.metaKey&&!e.altKey){const mm={v:'sel',n:'node',l:'link',t:'path',e:'scale'}[(e.key||'').toLowerCase()];if(mm)setMode(mm)}});
addEventListener('resize',draw);

/* ---------- Démarrage ---------- */
try{const d=localStorage.getItem('fibre:draft');if(d)S=Object.assign(blank(),JSON.parse(d))}catch(e){}
idb('get','draft').then(b=>{if(b&&!S.bg){S.bg=b;lastBgSaved=b;fit();draw()}}).catch(()=>{});
fit();setMode('sel');side();lastSnap=snap();

let instEv=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e;const b=$('#inst');if(b)b.style.display=''});
addEventListener('appinstalled',()=>{instEv=null;const b=$('#inst');if(b)b.style.display='none';toast('Application installée')});
async function installApp(){if(!instEv)return;instEv.prompt();try{await instEv.userChoice}catch(e){}instEv=null;$('#inst').style.display='none'}
if(!inFrame&&/^https?:$/.test(location.protocol)&&!/(^|\.)claude(usercontent)?\.(ai|com)$/.test(location.hostname)){
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(r=>{r.addEventListener('updatefound',()=>{const w=r.installing;w&&w.addEventListener('statechange',()=>{if(w.state=='installed'&&navigator.serviceWorker.controller)toast('Nouvelle version installée : elle sera active à la prochaine ouverture',6000)})})}).catch(()=>{});
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
